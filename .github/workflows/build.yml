name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Extract app source
        run: |
          mkdir -p extracted
          unzip -q shop_app.zip -d extracted
          mv extracted/shop_app app
          ls -la app

      - name: Add Android platform files
        working-directory: app
        run: |
          cp pubspec.yaml /tmp/pubspec.bak
          flutter create --platforms=android --project-name shop_app .
          cp /tmp/pubspec.bak pubspec.yaml
          flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Show APK
        run: ls -lh app/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
